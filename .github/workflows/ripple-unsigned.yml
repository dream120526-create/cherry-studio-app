name: Ripple · unsigned ipa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: prebuild + xcodebuild (unsigned)
    runs-on: macos-26
    timeout-minutes: 180
    env:
      PROFILE: production
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (ios)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: CocoaPods
        working-directory: ios
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then brew install cocoapods; fi
          pod install --repo-update

      - name: Build (unsigned)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          if ! xcodebuild -workspace "$WS" -list -json | jq -r '.workspace.schemes[]' | grep -qx "$SCHEME"; then
            SCHEME=$(xcodebuild -workspace "$WS" -list -json | jq -r '.workspace.schemes[]' | grep -v '^Pods-' | grep -vi 'backup' | head -1)
          fi
          echo "workspace=$WS scheme=$SCHEME"
          xcodebuild -workspace "$WS" -list -json | jq -r '.workspace.schemes[]' | sed 's/^/scheme: /'
          xcodebuild build             -workspace "$WS" -scheme "$SCHEME" -configuration Release             -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""             -skipPackagePluginValidation -skipMacroValidation             2>&1 | tee xcodebuild.log | tail -n 60
          grep -q "\*\* BUILD SUCCEEDED \*\*" xcodebuild.log

      - name: Package ipa
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | grep -v '/Pods' | head -1)
          echo "app=$APP"
          test -d "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          ( cd out && zip -qry "Cherry-unsigned-${GITHUB_RUN_NUMBER}.ipa" Payload )
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: cherry-ipa-${{ github.run_number }}
          path: out/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="cherry-${{ github.run_number }}"
          gh release create "$TAG" out/Cherry-unsigned-*.ipa \
            --title "Cherry unsigned build ${{ github.run_number }}" \
            --notes "Unsigned ipa, self-sign before installing." \
            --latest || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: xcodebuild.log
          retention-days: 7
          if-no-files-found: warn
